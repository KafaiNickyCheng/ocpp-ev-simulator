name: cp_app
description: OCPP 1.6 ChargePoint Simulator

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # SignalR (same package as CSMS app)
  signalr_netcore: ^1.3.4

  # HTTP (for health check)
  http: ^1.2.1

  # Persistence
  shared_preferences: ^2.3.2

  # OCPP message ID generation
  uuid: ^4.4.0

  # Date formatting in log screen
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
