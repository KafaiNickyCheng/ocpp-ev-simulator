name: csms_app
description: OCPP 1.6 CSMS Operator App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # SignalR connection to backend
  signalr_netcore: ^1.3.4

  # State management
  provider: ^6.1.1

  # Charts for power/energy graphs
  fl_chart: ^0.68.0

  # Local storage (settings persistence)
  shared_preferences: ^2.2.2

  # Time formatting
  intl: ^0.19.0

  # HTTP for REST fallback
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
